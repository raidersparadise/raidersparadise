$kind: http-request
description: Crea un registro. Completa el body JSON según las reglas de validación del recurso.
url: "{{base_url}}/api/categoria"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "nombre_categoria": "Ropa",
        "descripcion_categoria": "Artículos de vestir y accesorios"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('La respuesta tiene un estado HTTP válido', function () {
          pm.expect(pm.response.code).to.be.within(200, 499);
      });
    language: text/javascript
order: 2000
