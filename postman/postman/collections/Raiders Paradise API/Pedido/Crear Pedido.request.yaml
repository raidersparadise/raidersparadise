$kind: http-request
description: Crea un registro. Completa el body JSON según las reglas de validación del recurso.
url: "{{base_url}}/api/pedido"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "fecha": "2026-09-14",
        "estado": "programado",
        "total": 90000,
        "id_cliente": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('La respuesta tiene un estado HTTP válido', function () {
          pm.expect(pm.response.code).to.be.within(200, 499);
      });
    language: text/javascript
order: 2000
