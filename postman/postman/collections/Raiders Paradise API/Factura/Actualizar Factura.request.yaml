$kind: http-request
description: Actualiza un registro. Completa el body JSON según las reglas de validación del recurso.
url: "{{base_url}}/api/factura/{{id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "fecha_factura": "2026-09-14",
        "total_factura": 125000,
        "impuesto": 10000,
        "estado_factura": "pagada",
        "pago": 125000,
        "metodo_pago": "tarjeta",
        "id_pedido": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('La respuesta tiene un estado HTTP válido', function () {
          pm.expect(pm.response.code).to.be.within(200, 499);
      });
    language: text/javascript
order: 4000
